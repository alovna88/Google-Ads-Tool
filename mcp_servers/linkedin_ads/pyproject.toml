[project]
name = "agency-linkedin-mcp"
version = "0.1.0"
description = "MCP server exposing the agency's LinkedIn Ads data to Claude. Reads from the agency_ads FastAPI app over HTTP; the app owns OAuth + token refresh."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
agency-linkedin-mcp = "agency_linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency_linkedin_mcp"]
